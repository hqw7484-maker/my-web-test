<!DOCTYPE html>
<html>
<head>
    <title>TERMINAL ACTIVE</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
        #overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; text-align: center; background: rgba(0,0,0,0.8);
            padding: 20px; border: 1px solid #0f0; box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>CORE SYSTEM SECURED</h1>
        <p>STATUS: RUNNING</p>
        <p>LOCATION: RENDER_NODE_KOREA</p>
    </div>
    <canvas id="c"></canvas>
    <script>
        var c = document.getElementById("c");
        var ctx = c.getContext("2d");
        c.height = window.innerHeight;
        c.width = window.innerWidth;
        var matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%";
        matrix = matrix.split("");
        var font_size = 10;
        var columns = c.width/font_size;
        var drops = [];
        for(var x = 0; x < columns; x++) drops[x] = 1;
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#0F0";
            ctx.font = font_size + "px arial";
            for(var i = 0; i < drops.length; i++) {
                var text = matrix[Math.floor(Math.random()*matrix.length)];
                ctx.fillText(text, i*font_size, drops[i]*font_size);
                if(drops[i]*font_size > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 35);
    </script>
</body>
</html>
